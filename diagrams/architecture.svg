<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" width="900" height="960" role="img" aria-labelledby="t d">
  <title id="t">Private TEAM architecture</title>
  <desc id="d">The browser reaches TEAM only over the corporate network (Direct Connect, VPN or Transit Gateway): an internal ALB with no public IP in front of nginx on ECS Fargate serving the SPA, and the appsync-api interface endpoint in front of an AppSync API with Visibility PRIVATE. The six Lambdas that call AppSync run in the VPC's private subnets and use a NAT gateway for outbound calls to AWS APIs such as Identity Center and Organizations. Session audit logs come from the Control Tower organization trail's CloudWatch log group in the management account, queried with Logs Insights through an assumed role. The only public surface is Cognito managed login, which federates to IAM Identity Center over SAML.</desc>
  <defs>
  <style>
  text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
  .bg { fill: #ffffff; }
  .public { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 10 6; }
  .public-label { font-size: 19px; font-weight: 700; fill: #9a3412; }
  .account { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
  .account-label { font-size: 20px; font-weight: 700; fill: #334155; }
  .vpc { fill: #ffffff; stroke: #16a34a; stroke-width: 2.5; }
  .vpc-label { font-size: 19px; font-weight: 700; fill: #15803d; }
  .comp { fill: #ffffff; stroke: #334155; stroke-width: 2; }
  .comp-dim { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
  .comp-text { font-size: 18px; font-weight: 600; }
  .comp-sub { font-size: 16px; fill: #475569; }
  .net { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
  .flow-label { font-size: 16px; fill: #334155; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
  .private { fill: none; stroke: #0369a1; stroke-width: 4; }
  .login { fill: none; stroke: #c2410c; stroke-width: 4; stroke-dasharray: 12 6; }
  .egress { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 4 5; }
  .audit { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 10 5; }
  .legend-text { font-size: 16px; fill: #334155; }
  </style>
  <marker id="arrow-private" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
  <marker id="arrow-login" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  <marker id="arrow-egress" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="arrow-audit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="960" class="bg"/>
  <rect x="30" y="40" width="230" height="72" rx="6" class="net"/>
  <text x="145.0" y="72.0" class="comp-text" text-anchor="middle">Browser</text>
  <text x="145.0" y="93.0" class="comp-sub" text-anchor="middle">on the corporate network</text>
  <rect x="330" y="20" width="556" height="150" rx="6" class="public"/>
  <text x="350" y="48" class="public-label" text-anchor="start">Public, AWS managed</text>
  <rect x="345" y="66" width="252" height="72" rx="6" class="comp"/>
  <text x="471.0" y="98.0" class="comp-text" text-anchor="middle">Cognito managed login</text>
  <text x="471.0" y="119.0" class="comp-sub" text-anchor="middle">the only public surface</text>
  <rect x="660" y="66" width="210" height="72" rx="6" class="comp"/>
  <text x="765.0" y="98.0" class="comp-text" text-anchor="middle">IAM Identity Center</text>
  <text x="765.0" y="119.0" class="comp-sub" text-anchor="middle">SAML IdP, portal</text>
  <rect x="30" y="220" width="840" height="500" rx="6" class="account"/>
  <text x="850" y="250" class="account-label" text-anchor="end">TEAM account (Identity Center delegated admin)</text>
  <rect x="50" y="268" width="490" height="432" rx="6" class="vpc"/>
  <text x="70" y="686" class="vpc-label" text-anchor="start">VPC: private subnets, 2 AZs</text>
  <rect x="68" y="320" width="220" height="72" rx="6" class="comp"/>
  <text x="178.0" y="352.0" class="comp-text" text-anchor="middle">Internal ALB</text>
  <text x="178.0" y="373.0" class="comp-sub" text-anchor="middle">HTTPS, no public IP</text>
  <rect x="68" y="440" width="220" height="72" rx="6" class="comp"/>
  <text x="178.0" y="472.0" class="comp-text" text-anchor="middle">ECS Fargate</text>
  <text x="178.0" y="493.0" class="comp-sub" text-anchor="middle">nginx serves the SPA</text>
  <rect x="68" y="560" width="220" height="72" rx="6" class="comp"/>
  <text x="178.0" y="592.0" class="comp-text" text-anchor="middle">Private hosted zone</text>
  <text x="178.0" y="613.0" class="comp-sub" text-anchor="middle">team.example.com</text>
  <rect x="310" y="320" width="210" height="72" rx="6" class="comp"/>
  <text x="415.0" y="352.0" class="comp-text" text-anchor="middle">appsync-api</text>
  <text x="415.0" y="373.0" class="comp-sub" text-anchor="middle">interface endpoint</text>
  <rect x="310" y="440" width="210" height="72" rx="6" class="comp"/>
  <text x="415.0" y="472.0" class="comp-text" text-anchor="middle">Six Lambdas</text>
  <text x="415.0" y="493.0" class="comp-sub" text-anchor="middle">call the private API</text>
  <rect x="310" y="560" width="210" height="72" rx="6" class="comp"/>
  <text x="415.0" y="592.0" class="comp-text" text-anchor="middle">NAT gateway</text>
  <text x="415.0" y="613.0" class="comp-sub" text-anchor="middle">outbound only</text>
  <rect x="580" y="320" width="270" height="72" rx="6" class="comp"/>
  <text x="715.0" y="352.0" class="comp-text" text-anchor="middle">AppSync API</text>
  <text x="715.0" y="373.0" class="comp-sub" text-anchor="middle">Visibility: PRIVATE</text>
  <rect x="580" y="440" width="270" height="72" rx="6" class="comp"/>
  <text x="715.0" y="472.0" class="comp-text" text-anchor="middle">TEAM backend</text>
  <text x="715.0" y="493.0" class="comp-sub" text-anchor="middle">DynamoDB, Step Functions</text>
  <rect x="580" y="560" width="270" height="72" rx="6" class="comp-dim"/>
  <text x="715.0" y="592.0" class="comp-text" text-anchor="middle">CodeBuild</text>
  <text x="715.0" y="613.0" class="comp-sub" text-anchor="middle">builds and deploys TEAM</text>
  <rect x="310" y="790" width="210" height="72" rx="6" class="net"/>
  <text x="415.0" y="822.0" class="comp-text" text-anchor="middle">AWS APIs</text>
  <text x="415.0" y="843.0" class="comp-sub" text-anchor="middle">Identity Center, Orgs</text>
  <rect x="560" y="760" width="310" height="130" rx="6" class="account"/>
  <text x="580" y="790" class="account-label" text-anchor="start">Management account</text>
  <rect x="580" y="806" width="270" height="70" rx="6" class="comp"/>
  <text x="715.0" y="837.0" class="comp-text" text-anchor="middle">Org trail log group</text>
  <text x="715.0" y="858.0" class="comp-sub" text-anchor="middle">CloudWatch Logs Insights</text>
  <path d="M260,90 L345,90" class="login" marker-end="url(#arrow-login)"/>
  <path d="M597,102 L660,102" class="login" marker-end="url(#arrow-login)" marker-start="url(#arrow-login)"/>
  <text x="628" y="92" class="flow-label" text-anchor="middle">SAML</text>
  <path d="M145,112 L145,320" class="private" marker-end="url(#arrow-private)"/>
  <text x="244" y="196" class="flow-label" text-anchor="start">Direct Connect, VPN or TGW</text>
  <path d="M230,112 L230,290 L415,290 L415,320" class="private" marker-end="url(#arrow-private)"/>
  <path d="M178,392 L178,440" class="private" marker-end="url(#arrow-private)"/>
  <path d="M520,356 L580,356" class="private" marker-end="url(#arrow-private)"/>
  <path d="M415,440 L415,392" class="private" marker-end="url(#arrow-private)"/>
  <path d="M715,392 L715,440" class="private" marker-end="url(#arrow-private)"/>
  <path d="M415,632 L415,790" class="egress" marker-end="url(#arrow-egress)"/>
  <path d="M520,610 L548,610 L548,841 L580,841" class="audit" marker-end="url(#arrow-audit)"/>
  <text x="538" y="748" class="flow-label" text-anchor="end">assume role,</text>
  <text x="538" y="768" class="flow-label" text-anchor="end">query logs</text>
  <path d="M40,930 L86,930" class="private"/>
  <text x="96" y="936" class="legend-text" text-anchor="start">Private network path</text>
  <path d="M298.0,930 L344.0,930" class="login"/>
  <text x="354.0" y="936" class="legend-text" text-anchor="start">Public sign-in</text>
  <path d="M505.6,930 L551.6,930" class="egress"/>
  <text x="561.6" y="936" class="legend-text" text-anchor="start">Outbound only</text>
  <path d="M704.8,930 L750.8,930" class="audit"/>
  <text x="760.8" y="936" class="legend-text" text-anchor="start">Audit log query</text>
</svg>

AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Temporary Elevated Access Management (TEAM) Application stack - private UI
  (internal ALB + Fargate), CodeBuild build runner, ECR, private hosted zone.

# TEAM must be deployed in the IAM Identity Center home region. This is the
# single place to change it for another organisation.
Rules:
  IdentityCenterRegion:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-2]
        AssertDescription: >-
          TEAM must be deployed in the IAM Identity Center region (us-east-2 for
          this organisation). Change the constant in the IdentityCenterRegion rule
          if your Identity Center instance lives elsewhere.
  CertificateSource:
    RuleCondition: !Equals [!Ref UiPublicZoneId, '']
    Assertions:
      - Assert: !Not [!Equals [!Ref UiCertificateArn, '']]
        AssertDescription: >-
          Set UiPublicZoneId (same-account public zone, CloudFormation validates
          the certificate) or UiCertificateArn (pre-issued certificate, see
          deployment/request-cert.sh).

Parameters:
  Login:
    Type: String
    Description: IAM IDC Login URL
  CloudTrailAuditLogs:
    Type: "String"
    AllowedPattern: "(read_write|read|write|none|arn.*)"
    Description: Which events should be logged on the TEAM Application Cloudtrail Lake EventDataStore.  Acceptable values are "read","write","read_write", and "none".  You may also enter the arn of an existing Cloudtrail Lake EDS.
  teamAdminGroup:
    Type: String
    Description: TEAM application Admin group
  teamAuditGroup:
    Type: String
    Description: TEAM application Auditor group
  tags:
    Type: String
    Description: TEAM application tags
    Default: ""
  teamAccount:
    Type: String
    Description: TEAM deployment account ID
  cacheTTL:
    Type: Number
    Description: Cache TTL in seconds for OU accounts cache
    Default: 604800
  VpcId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::VPC::Id>'
    Default: /network/vpc-id
    Description: SSM parameter holding the VPC ID (written by the network baseline)
  VpcCidr:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Default: /network/vpc-cidr
    Description: SSM parameter holding the VPC CIDR
  PrivateSubnetIds:
    Type: 'AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>'
    Default: /network/private-subnet-ids
    Description: SSM parameter (StringList) holding the private subnet IDs
  UiDomain:
    Type: String
    Description: 'Bare hostname, e.g. team.example.com'
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: Lower-case bare hostname, no scheme and no trailing dot
  UiPublicZoneId:
    Type: String
    Default: ''
    Description: 'Public hosted zone for ACM DNS validation (same account). Empty => UiCertificateArn required.'
  UiCertificateArn:
    Type: String
    Default: ''
    Description: 'Pre-issued ACM cert ARN for UiDomain. Used when UiPublicZoneId is empty.'
  AllowedClientCidr:
    Type: String
    Default: ''
    Description: 'Extra CIDR allowed to reach the ALB on 443 (corp network). VPC CIDR is always allowed.'

Conditions:
  IsEmptyCloudTrailAuditLogs: !Equals [!Ref CloudTrailAuditLogs, ""]
  CreateCert: !Not [!Equals [!Ref UiPublicZoneId, '']]
  HasClientCidr: !Not [!Equals [!Ref AllowedClientCidr, '']]

Resources:
  # ---------------------------------------------------------------- network
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "AWS APIs (sso-admin, identitystore, organizations, cognito-idp, states, cloudtrail) are reached via NAT; HTTPS only."
    Properties:
      GroupDescription: TEAM Lambdas in VPC - no ingress, HTTPS egress only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: HTTPS to AWS APIs (NAT) and the appsync-api endpoint
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: team-lambda

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TEAM internal ALB - HTTPS from the VPC (and optional client CIDR)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: HTTPS from inside the VPC
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      # Placeholder rule that matches nothing; it replaces the default
      # allow-all egress. The real egress (8080 to the tasks) is the separate
      # AlbToTaskEgress resource, which avoids a SG reference cycle.
      SecurityGroupEgress:
        - Description: Disallow all traffic (placeholder)
          IpProtocol: icmp
          FromPort: 252
          ToPort: 86
          CidrIp: 255.255.255.255/32
      Tags:
        - Key: Name
          Value: team-alb

  AlbClientCidrIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasClientCidr
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: HTTPS from the corporate client network
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedClientCidr

  UiTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "ECR API and CloudWatch Logs via NAT; ECR layers via the S3 gateway endpoint. HTTPS only."
    Properties:
      GroupDescription: TEAM UI Fargate tasks - 8080 from the ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: nginx from the ALB
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - Description: HTTPS to ECR, CloudWatch Logs and S3
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: team-ui-task

  AlbToTaskEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: ALB to UI tasks
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref UiTaskSecurityGroup

  # ---------------------------------------------------------------- build
  UiRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  SourceBucket:
    Type: AWS::S3::Bucket
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "Holds only the source zip CodeBuild reads; CloudTrail data events cover access if required."
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldSourceVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SourceBucket.Arn
              - !Sub '${SourceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  BuildRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W9
            reason: "Build runner for `amplify push`, which creates IAM roles, Lambda, AppSync, Cognito, DynamoDB, Step Functions and CloudFormation stacks. Same AdministratorAccess posture as upstream's Amplify service role; deliberately not scoped."
          - id: W43
            reason: "AdministratorAccess is a deliberate carry-over from upstream's Amplify service role; `amplify push` provisions IAM and arbitrary backend resources."
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Path: /
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AdministratorAccess"

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /team/codebuild
      RetentionInDays: 30

  Build:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Builds the TEAM backend (amplify push) and UI image, then deploys TEAM-IDC-UI
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 120
      Source:
        Type: S3
        Location: !Sub '${SourceBucket}/source.zip'
        BuildSpec: deployment/buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: SSO_LOGIN
            Value: !Ref Login
          - Name: TEAM_ACCOUNT
            Value: !Ref teamAccount
          - Name: CLOUDTRAIL_AUDIT_LOGS
            Value: !If
              - IsEmptyCloudTrailAuditLogs
              - "read_write"
              - !Ref CloudTrailAuditLogs
          - Name: TEAM_ADMIN_GROUP
            Value: !Ref teamAdminGroup
          - Name: TEAM_AUDITOR_GROUP
            Value: !Ref teamAuditGroup
          - Name: TAGS
            Value: !Ref tags
          - Name: CACHE_TTL
            Value: !Ref cacheTTL
          - Name: UI_DOMAIN
            Value: !Ref UiDomain
          - Name: COGNITO_DOMAIN_PREFIX
            Value: !Sub 'team-${AWS::AccountId}'
          - Name: LAMBDA_SUBNET_IDS
            Value: !Join [',', !Ref PrivateSubnetIds]
          - Name: LAMBDA_SECURITY_GROUP_ID
            Value: !Ref LambdaSecurityGroup
          - Name: AMPLIFY_ENV
            Value: main
          - Name: UI_REPOSITORY_URI
            Value: !GetAtt UiRepository.RepositoryUri

  # ---------------------------------------------------------------- runtime
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  UiTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Path: /
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

  UiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /team/ui
      RetentionInDays: 30

  UiCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCert
    Properties:
      DomainName: !Ref UiDomain
      KeyAlgorithm: EC_prime256v1
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref UiDomain
          HostedZoneId: !Ref UiPublicZoneId

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W52
            reason: "Experiment; access logs not required for an internal ALB serving static assets."
    Properties:
      Type: application
      Scheme: internal
      Subnets: !Ref PrivateSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: deletion_protection.enabled
          Value: 'false'

  UiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthz
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If [CreateCert, !Ref UiCertificate, !Ref UiCertificateArn]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref UiTargetGroup

  # Named exactly UiDomain (e.g. team.example.com), not the parent domain,
  # so inside the VPC it does not shadow the rest of the public zone.
  PrivateZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref UiDomain
      HostedZoneConfig:
        Comment: TEAM private UI hostname (resolves only inside the VPC)
      VPCs:
        - VPCId: !Ref VpcId
          VPCRegion: !Ref AWS::Region

  UiRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateZone
      Name: !Ref UiDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:
  ClusterArn:
    Value: !GetAtt Cluster.Arn
    Export:
      Name: TEAM-ClusterArn
  UiTargetGroupArn:
    Value: !Ref UiTargetGroup
    Export:
      Name: TEAM-UiTargetGroupArn
  UiTaskSecurityGroupId:
    Value: !Ref UiTaskSecurityGroup
    Export:
      Name: TEAM-UiTaskSecurityGroupId
  UiTaskExecutionRoleArn:
    Value: !GetAtt UiTaskExecutionRole.Arn
    Export:
      Name: TEAM-UiTaskExecutionRoleArn
  PrivateSubnetIds:
    Value: !Join [',', !Ref PrivateSubnetIds]
    Export:
      Name: TEAM-PrivateSubnetIds
  UiRepositoryUri:
    Value: !GetAtt UiRepository.RepositoryUri
    Export:
      Name: TEAM-UiRepositoryUri
  SourceBucket:
    Value: !Ref SourceBucket
    Export:
      Name: TEAM-SourceBucket
  BuildProject:
    Value: !Ref Build
    Export:
      Name: TEAM-BuildProject
  UiUrl:
    Value: !Sub 'https://${UiDomain}/'
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup

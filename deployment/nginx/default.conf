# nginx config for the TEAM UI container (non-root, port 8080).
#
# Security headers are repeated in every location that sets its own
# add_header, because nginx drops inherited add_header directives in any
# block that declares one of its own.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src https://*.amazonaws.com https://*.amazoncognito.com wss://*.amazonaws.com; font-src 'self' data:; style-src 'self' 'unsafe-inline';" always;

    # ALB target group health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # SPA entry point: never cache, so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src https://*.amazonaws.com https://*.amazoncognito.com wss://*.amazonaws.com; font-src 'self' data:; style-src 'self' 'unsafe-inline';" always;
    }

    # Content-hashed build assets: cache for a year.
    location ~* \.(js|css|png|svg|ico|woff2?|ttf|map)$ {
        # One combined header; `expires 1y` would emit a second Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src https://*.amazonaws.com https://*.amazoncognito.com wss://*.amazonaws.com; font-src 'self' data:; style-src 'self' 'unsafe-inline';" always;
    }

    # Client-side routes: deep links fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
